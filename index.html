<!DOCTYPE html>
<html>
<head>
    <title>Italian Question</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #008C45, #F4F5F0, #CD212A);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 50px 70px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin-bottom: 30px;
            font-weight: 500;
            color: #333;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            background: #CD212A;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            background: #a51b22;
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.3);
        }

        #answer {
            margin-top: 25px;
            font-size: 20px;
            color: #444;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Italian Quiz</h1>
        <button onclick="showAnswer()">Who is a real Italian?</button>
        <div id="answer">not fil</div>
    </div>

    <script>
        function showAnswer() {
            document.getElementById("answer").classList.add("show");
        }
    </script>

</body>
</html>
